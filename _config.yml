# Jekyll конфигурация для GitHub Pages
title: "Backend / Fullstack Разработчик (Go / Node.js) / Программный инженер"
description: "Backend / Fullstack Разработчик (Go / Node.js) / Программный инженер • Москва. Node.js, Python, PostgreSQL, Docker, Kubernetes."
url: "https://skywireneo.github.io"
baseurl: ""

# Настройки сборки
markdown: kramdown
highlighter: rouge

# Плагины
plugins: []

# Включить в сборку
include:
  - _data
  - _config

# Исключить из сборки
exclude:
  - README-JEKYLL.md
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml

# Автор
author:
  name: Андрей SkyWireNEO
  email: skywireneo@yandex.ru

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:slug/
