<div class="section-divider"></div>
<!-- Обо мне -->
<section class="card glass-card animate-on-scroll" id="about">

    <h2><i class="fas fa-user"></i>Обо мне</h2>

    <!-- Facts - loaded from JSON -->
    <div id="aboutFacts"></div>

    <h3>Основной стек</h3>
    <!-- Main stack tech tags - loaded from JSON -->
    <div id="mainStackTags"></div>

    <!-- Skill bars - loaded from JSON -->
    <div id="mainStackSkills"></div>

    <!-- Stats Counters -->
    <div class="stats-grid">
        <div class="stat-item" data-stat="tech" id="techCounter">
            <div class="stat-number" data-target="0">0</div>
            <div class="stat-label" id="techLabel">Технологий</div>
            <div class="stat-suffix">+</div>
        </div>

        <div class="stat-item" data-stat="languages" id="languagesCounter">
            <div class="stat-number">0</div>
            <div class="stat-label" id="languagesLabel">Языка</div>
        </div>

        <div class="stat-item" data-stat="experience" id="experienceCounter">
            <div class="stat-number" data-target="0">0</div>
            <div class="stat-label" id="experienceLabel">Года опыта</div>
            <div class="stat-suffix">~+</div>
        </div>
        <div class="stat-item" data-stat="projects" id="projectsCounter">
            <div class="stat-number" data-target="0">0</div>
            <div class="stat-label" id="projectsLabel">Проекта</div>
            <div class="stat-suffix">+</div>
        </div>

    </div>

</section>
