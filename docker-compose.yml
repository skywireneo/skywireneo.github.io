version: '3.8'

services:
  jekyll:
    image: jekyll/jekyll:4.2.2
    container_name: skywireneo-jekyll
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - jekyll-cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    command: >
      bash -c "
        bundle install &&
        jekyll serve --host 0.0.0.0 --livereload --force_polling
      "
    restart: unless-stopped

volumes:
  jekyll-cache:
